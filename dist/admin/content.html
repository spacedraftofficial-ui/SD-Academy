<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Content Library — SD Academy Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/admin.css"/>
</head>
<body>
<div class="app-shell" id="app-shell">
  <div class="main-content">
    <div class="page-content" id="content" style="display:none">
      <div class="flex items-center justify-between mb-16">
        <h1 class="admin-page-title" style="margin:0">Content Library</h1>
        <button class="btn btn-primary" id="upload-btn">⬆ Upload Content</button>
      </div>
      <div class="card animate-fade-up">
        <div class="flex gap-8 mb-16" style="flex-wrap:wrap" id="content-filter-tabs">
          <button class="btn btn-primary btn-sm" data-filter="All">All</button>
          <button class="btn btn-ghost btn-sm" data-filter="video">Videos</button>
          <button class="btn btn-ghost btn-sm" data-filter="sop">SOPs</button>
          <button class="btn btn-ghost btn-sm" data-filter="assessment">Assessments</button>
          <button class="btn btn-ghost btn-sm" data-filter="document">Documents</button>
        </div>

        <div class="grid-4" id="content-grid"></div>
      </div>
    </div>
  </div>
</div>

<!-- Modal for Upload / Edit Content -->
<div class="modal-overlay" id="content-modal-overlay">
  <div class="modal" style="max-width:500px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h3 style="margin:0;font-size:18px;font-weight:700" id="content-modal-title">Upload New Content</h3>
      <button class="btn btn-ghost btn-sm" id="close-content-modal">✕</button>
    </div>
    <form id="content-form">
      <input type="hidden" id="modal-content-id" value=""/>
      <div style="margin-bottom:14px">
        <label style="display:block;font-size:12px;font-weight:600;color:var(--gray-700);margin-bottom:4px">Content Title *</label>
        <input type="text" id="modal-content-title" required placeholder="e.g. Architectural Design SOP" style="width:100%;height:38px;border:1.5px solid var(--gray-200);border-radius:8px;padding:0 12px;font-size:13px;outline:none"/>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
        <div>
          <label style="display:block;font-size:12px;font-weight:600;color:var(--gray-700);margin-bottom:4px">Type</label>
          <select id="modal-content-type" style="width:100%;height:38px;border:1.5px solid var(--gray-200);border-radius:8px;padding:0 10px;font-size:13px;outline:none">
            <option value="sop">SOP / Document</option>
            <option value="video">Video</option>
            <option value="assessment">Assessment</option>
            <option value="document">Document Template</option>
          </select>
        </div>
        <div>
          <label style="display:block;font-size:12px;font-weight:600;color:var(--gray-700);margin-bottom:4px">Department</label>
          <select id="modal-content-dept" style="width:100%;height:38px;border:1.5px solid var(--gray-200);border-radius:8px;padding:0 10px;font-size:13px;outline:none">
            <option value="Architecture">Architecture</option>
            <option value="Engineering">Engineering</option>
            <option value="Projects">Projects</option>
            <option value="IT Support">IT Support</option>
            <option value="HR">HR</option>
          </select>
        </div>
      </div>
      <div style="margin-bottom:14px">
        <label style="display:block;font-size:12px;font-weight:600;color:var(--gray-700);margin-bottom:4px">File URL / Resource Link</label>
        <input type="text" id="modal-content-url" placeholder="https://..." style="width:100%;height:38px;border:1.5px solid var(--gray-200);border-radius:8px;padding:0 12px;font-size:13px;outline:none"/>
      </div>
      <div style="margin-bottom:20px">
        <label style="display:block;font-size:12px;font-weight:600;color:var(--gray-700);margin-bottom:4px">Description</label>
        <textarea id="modal-content-desc" rows="3" placeholder="Brief explanation of this material..." style="width:100%;border:1.5px solid var(--gray-200);border-radius:8px;padding:10px 12px;font-size:13px;outline:none;resize:vertical"></textarea>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button type="button" class="btn btn-ghost" id="delete-content-btn" style="display:none;color:var(--danger);margin-right:auto">Delete</button>
        <button type="button" class="btn btn-outline" id="cancel-content-btn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="save-content-btn">Upload Content</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/nav.js"></script>
<script>
  let allMaterials = [
    { id: 1, title: 'Architectural Design SOP', type: 'sop', department: 'Architecture', updated: '2 days ago', icon: '📋', bg: 'linear-gradient(135deg,hsl(210,70%,50%),hsl(230,80%,40%))' },
    { id: 2, title: 'Modern Architecture Video', type: 'video', department: 'Architecture', updated: '3 days ago', icon: '🎬', bg: 'linear-gradient(135deg,hsl(240,70%,50%),hsl(260,80%,40%))' },
    { id: 3, title: 'Sketching Quiz', type: 'assessment', department: 'Architecture', updated: 'Yesterday', icon: '📝', bg: 'linear-gradient(135deg,hsl(270,70%,50%),hsl(290,80%,40%))' },
    { id: 4, title: 'CAD Template', type: 'document', department: 'Engineering', updated: '5 days ago', icon: '📐', bg: 'linear-gradient(135deg,hsl(300,70%,50%),hsl(320,80%,40%))' }
  ];

  let currentFilter = 'All';
  const grid = document.getElementById('content-grid');
  const contentModal = document.getElementById('content-modal-overlay');

  async function loadMaterials() {
    try {
      if (window.SDA_API && window.SDA_API.getMaterials) {
        const fetched = await window.SDA_API.getMaterials();
        if (Array.isArray(fetched) && fetched.length > 0) {
          const typeIcons = { sop:'📋', video:'🎬', assessment:'📝', document:'📐' };
          allMaterials = fetched.map((m, i) => ({
            id: m.id,
            title: m.title,
            type: m.type ? m.type.toLowerCase() : (m.is_sop ? 'sop' : 'video'),
            department: m.department || 'Architecture',
            updated: 'Recently',
            icon: typeIcons[m.type ? m.type.toLowerCase() : 'sop'] || '📋',
            bg: `linear-gradient(135deg,hsl(${210+i*30},70%,50%),hsl(${230+i*30},80%,40%))`
          }));
        }
      }
    } catch(err) {
      console.warn('Using default materials list:', err);
    }
    renderMaterials();
  }

  function renderMaterials() {
    grid.innerHTML = '';
    const filtered = allMaterials.filter(m => currentFilter === 'All' || m.type === currentFilter.toLowerCase());

    if (filtered.length === 0) {
      grid.innerHTML = `<div style="grid-column:1/-1;padding:40px;text-align:center;color:var(--gray-500);font-size:13px">No materials found in this category.</div>`;
      return;
    }

    filtered.forEach(m => {
      grid.innerHTML += `
        <div style="border:1.5px solid var(--gray-200);border-radius:var(--radius-md);overflow:hidden;transition:box-shadow .2s;background:#fff" onmouseover="this.style.boxShadow='var(--shadow-md)'" onmouseout="this.style.boxShadow='none'">
          <div style="height:100px;background:${m.bg || 'linear-gradient(135deg,#3b82f6,#1d4ed8)'};display:flex;align-items:center;justify-content:center;font-size:32px">${m.icon || '📋'}</div>
          <div style="padding:12px">
            <div style="font-size:12.5px;font-weight:700;color:var(--gray-800);margin-bottom:4px">${m.title}</div>
            <div style="font-size:11px;color:var(--gray-500);margin-bottom:10px">${m.department} · ${m.type.toUpperCase()}</div>
            <div class="flex gap-6">
              <button class="btn btn-ghost btn-sm" style="flex:1;font-size:11px" onclick="editMaterial(${m.id})">Edit</button>
              <button class="btn btn-outline btn-sm" style="flex:1;font-size:11px" onclick="assignMaterial('${m.title}')">Assign</button>
            </div>
          </div>
        </div>
      `;
    });
  }

  // Filter Tab Logic
  document.querySelectorAll('#content-filter-tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#content-filter-tabs button').forEach(b => {
        b.classList.remove('btn-primary');
        b.classList.add('btn-ghost');
      });
      btn.classList.remove('btn-ghost');
      btn.classList.add('btn-primary');
      currentFilter = btn.getAttribute('data-filter');
      renderMaterials();
    });
  });

  // Modal Handlers
  document.getElementById('upload-btn').addEventListener('click', () => {
    document.getElementById('content-modal-title').textContent = 'Upload New Content';
    document.getElementById('modal-content-id').value = '';
    document.getElementById('modal-content-title').value = '';
    document.getElementById('modal-content-type').value = 'sop';
    document.getElementById('modal-content-dept').value = 'Architecture';
    document.getElementById('modal-content-url').value = '';
    document.getElementById('modal-content-desc').value = '';
    document.getElementById('delete-content-btn').style.display = 'none';
    contentModal.classList.add('open');
  });

  function editMaterial(id) {
    const mat = allMaterials.find(m => m.id === id);
    if (!mat) return;
    document.getElementById('content-modal-title').textContent = 'Edit Content';
    document.getElementById('modal-content-id').value = mat.id;
    document.getElementById('modal-content-title').value = mat.title;
    document.getElementById('modal-content-type').value = mat.type;
    document.getElementById('modal-content-dept').value = mat.department;
    document.getElementById('modal-content-url').value = mat.file_url || '';
    document.getElementById('modal-content-desc').value = mat.description || '';
    document.getElementById('delete-content-btn').style.display = 'block';
    contentModal.classList.add('open');
  }

  function assignMaterial(title) {
    if (window.SDA && SDA.toast) {
      SDA.toast(`"${title}" assigned to department learners!`, 'info');
    } else {
      alert(`"${title}" assigned to department learners!`);
    }
  }

  document.getElementById('close-content-modal').addEventListener('click', () => contentModal.classList.remove('open'));
  document.getElementById('cancel-content-btn').addEventListener('click', () => contentModal.classList.remove('open'));

  // Save Content Form
  document.getElementById('content-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('modal-content-id').value;
    const title = document.getElementById('modal-content-title').value;
    const type = document.getElementById('modal-content-type').value;
    const department = document.getElementById('modal-content-dept').value;
    const file_url = document.getElementById('modal-content-url').value;
    const description = document.getElementById('modal-content-desc').value;

    const typeIcons = { sop:'📋', video:'🎬', assessment:'📝', document:'📐' };
    const materialData = { title, type, department, file_url, description, is_sop: type === 'sop' };

    try {
      if (id) {
        if (window.SDA_API && window.SDA_API.updateMaterial) {
          await window.SDA_API.updateMaterial(id, materialData);
        }
        const idx = allMaterials.findIndex(m => m.id == id);
        if (idx !== -1) {
          allMaterials[idx] = {
            ...allMaterials[idx],
            ...materialData,
            icon: typeIcons[type] || '📋'
          };
        }
        if (window.SDA && SDA.toast) SDA.toast('Content updated successfully!', 'success');
      } else {
        let created;
        if (window.SDA_API && window.SDA_API.createMaterial) {
          created = await window.SDA_API.createMaterial(materialData);
        }
        const newMat = created ? {
          id: created.id,
          title: created.title,
          type: created.type ? created.type.toLowerCase() : type,
          department: created.department || department,
          updated: 'Just now',
          icon: typeIcons[type] || '📋',
          bg: 'linear-gradient(135deg,hsl(210,70%,50%),hsl(230,80%,40%))'
        } : {
          id: Date.now(),
          ...materialData,
          updated: 'Just now',
          icon: typeIcons[type] || '📋',
          bg: 'linear-gradient(135deg,hsl(210,70%,50%),hsl(230,80%,40%))'
        };
        allMaterials.unshift(newMat);
        if (window.SDA && SDA.toast) SDA.toast('Content uploaded successfully!', 'success');
      }
    } catch(err) {
      if (window.SDA && SDA.toast) SDA.toast('Error saving content: ' + err.message, 'danger');
    }

    contentModal.classList.remove('open');
    renderMaterials();
  });

  // Delete Content
  document.getElementById('delete-content-btn').addEventListener('click', async () => {
    const id = document.getElementById('modal-content-id').value;
    if (!id || !confirm('Are you sure you want to delete this content item?')) return;

    try {
      if (window.SDA_API && window.SDA_API.deleteMaterial) {
        await window.SDA_API.deleteMaterial(id);
      }
      allMaterials = allMaterials.filter(m => m.id != id);
      if (window.SDA && SDA.toast) SDA.toast('Content item deleted.', 'warning');
    } catch(err) {
      if (window.SDA && SDA.toast) SDA.toast('Error deleting content: ' + err.message, 'danger');
    }

    contentModal.classList.remove('open');
    renderMaterials();
  });

  const user = SDA.init({ role: 'admin' });
  if (user) {
    document.getElementById('content').style.display = '';
    loadMaterials();
  }
</script>
</body>
</html>
