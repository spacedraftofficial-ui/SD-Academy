<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Master Handbook Library &amp; Governance Catalog — SD Academy Admin</title>
  <meta name="description" content="Central Master Handbook Registry for SD Group containing 318 registered specifications, SOPs, policies, and quiz requirements."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/admin.css"/>
  <style>
    .handbook-card {
      background: #fff;
      border: 1px solid var(--gray-200);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s ease;
    }
    .handbook-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      border-color: var(--primary);
    }
    .filter-select {
      height: 36px;
      border: 1.5px solid var(--gray-200);
      border-radius: 8px;
      padding: 0 10px;
      font-size: 12px;
      outline: none;
      background: #fff;
    }
  </style>
</head>
<body>
<div class="app-shell" id="app-shell">
  <div class="main-content">
    <div class="page-content" id="content" style="display:none">
      
      <div class="flex items-center justify-between mb-16" style="flex-wrap:wrap;gap:12px">
        <div>
          <h1 class="admin-page-title" style="margin:0">Master Handbook Library (318 Registered Books)</h1>
          <p style="margin:4px 0 0 0;font-size:13px;color:var(--gray-500)">
            Master governance registry from 8 Excel files. Content PDFs are currently under correction and will be published subsequently.
          </p>
        </div>
        <div style="display:flex;gap:10px">
          <a href="users.html" class="btn btn-outline" style="font-size:13px">👤 User Access Scope</a>
          <button class="btn btn-primary" id="upload-btn" style="font-size:13px">+ Register Handbook</button>
        </div>
      </div>

      <div class="card animate-fade-up">
        <!-- Search & Filter Controls -->
        <div class="flex items-center gap-10 mb-16" style="flex-wrap:wrap">
          <input type="text" id="handbook-search" placeholder="Search by Book ID (e.g. SDG-COR-01), Title, Department..." style="flex:1.5;min-width:220px;height:36px;border:1.5px solid var(--gray-200);border-radius:8px;padding:0 12px;outline:none;font-size:13px"/>
          
          <select id="filter-company" class="filter-select">
            <option value="">All Companies / Entities (318)</option>
          </select>

          <select id="filter-level" class="filter-select">
            <option value="">All Access Bands</option>
            <option value="L1">L1 — Foundation</option>
            <option value="L2">L2 — Practitioner</option>
            <option value="L3">L3 — Senior / Coordinator</option>
            <option value="L4">L4 — Manager / HOD</option>
            <option value="L5">L5 — Leadership</option>
          </select>

          <select id="filter-category" class="filter-select">
            <option value="">All Categories</option>
            <option value="Company / Division Handbook">Company Handbooks</option>
            <option value="Department Handbook">Department SOPs</option>
            <option value="Policy">Group Policies</option>
            <option value="Governance">Governance</option>
          </select>
        </div>

        <div style="font-size:12px;color:var(--gray-500);margin-bottom:12px">
          Showing <strong id="visible-count" style="color:var(--gray-900)">318</strong> handbooks in master catalog
        </div>

        <div class="grid" id="handbook-grid" style="grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));gap:14px"></div>
      </div>

    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/org-master-data.js"></script>
<script src="../js/access-engine.js"></script>

<script>
(function() {
  'use strict';

  const authUser = SDA.init({ role: 'admin' });
  if (authUser) {
    document.getElementById('content').style.display = '';
    initHandbookLibrary();
  }

  function initHandbookLibrary() {
    const org = window.SD_ORG_DATA || {};
    const handbooks = org.handbooks || [];
    const companies = org.companies || [];

    const compSelect = document.getElementById('filter-company');
    companies.forEach(c => {
      compSelect.innerHTML += `<option value="${c}">${c}</option>`;
    });

    function render() {
      const q = document.getElementById('handbook-search').value.toLowerCase();
      const comp = compSelect.value;
      const level = document.getElementById('filter-level').value;
      const cat = document.getElementById('filter-category').value;

      const filtered = handbooks.filter(b => {
        const id = (b['Book ID'] || '').toLowerCase();
        const title = (b['Book Title'] || '').toLowerCase();
        const dept = (b['Department'] || '').toLowerCase();
        const bComp = b.company || '';
        const bLevel = b['Employee Level Access'] || b['Access Band'] || 'L1-L5';
        const bCat = b['Book Category'] || '';

        const matchQ = !q || id.includes(q) || title.includes(q) || dept.includes(q);
        const matchComp = !comp || bComp === comp;
        const matchLevel = !level || bLevel.includes(level) || bLevel === 'L1-L5';
        const matchCat = !cat || bCat.includes(cat);

        return matchQ && matchComp && matchLevel && matchCat;
      });

      document.getElementById('visible-count').textContent = filtered.length;
      const grid = document.getElementById('handbook-grid');
      grid.innerHTML = '';

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--gray-400)">No handbooks match your filter criteria.</div>`;
        return;
      }

      filtered.forEach(b => {
        const id = b['Book ID'] || 'N/A';
        const title = b['Book Title'] || 'Untitled Handbook';
        const bCompany = b.company || 'Common SD Group';
        const dept = b['Department'] || 'General';
        const band = b['Employee Level Access'] || b['Access Band'] || 'L1-L5';
        const category = b['Book Category'] || 'Handbook';
        const quiz = b['Quiz / Assessment Required'] === 'Yes';
        const ack = b['Employee Acknowledgement Required'] === 'Yes';
        const owner = b['Book Owner'] || 'SD Group Governance';

        grid.innerHTML += `
          <div class="handbook-card">
            <div>
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                <span style="font-family:monospace;font-size:11px;font-weight:700;color:var(--primary);background:rgba(59,130,246,0.1);padding:3px 8px;border-radius:6px">${id}</span>
                <span style="font-size:11px;font-weight:700;color:var(--gray-600);background:var(--gray-100);padding:2px 8px;border-radius:10px">${band}</span>
              </div>
              <h3 style="margin:0 0 6px 0;font-size:14px;font-weight:700;color:var(--gray-900);line-height:1.4">${title}</h3>
              <div style="font-size:11px;color:var(--gray-500);margin-bottom:10px">
                <strong>${bCompany}</strong> &bull; Dept: ${dept}
              </div>
              <div style="font-size:11px;color:var(--gray-400)">
                Owner: ${owner}
              </div>
            </div>

            <div style="border-top:1px solid var(--gray-100);padding-top:10px;margin-top:12px;display:flex;justify-content:space-between;align-items:center">
              <div style="display:flex;gap:4px">
                ${quiz ? '<span class="badge badge-success" style="font-size:10px">Quiz Gate</span>' : ''}
                ${ack ? '<span class="badge badge-warning" style="font-size:10px">Ack Required</span>' : ''}
              </div>
              <span style="font-size:11px;color:var(--gray-400);font-style:italic">Under Correction</span>
            </div>
          </div>
        `;
      });
    }

    document.getElementById('handbook-search').addEventListener('input', render);
    compSelect.addEventListener('change', render);
    document.getElementById('filter-level').addEventListener('change', render);
    document.getElementById('filter-category').addEventListener('change', render);

    render();
  }
})();
</script>
</body>
</html>
