<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reports & Escalations — SD Academy Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/admin.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="app-shell" id="app-shell">
  <div class="main-content">
    <div class="page-content" id="content" style="display:none">
      <h1 class="admin-page-title animate-fade-up">Reports & Escalations</h1>
      <div class="grid-2 stagger">
        <div class="card animate-fade-up">
          <div class="card-title mb-12">Department Completion Rate</div>
          <canvas id="dept-bar-chart" height="200"></canvas>
        </div>
        <div class="card animate-fade-up">
          <div class="card-title mb-12">Overdue Escalations</div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <div style="display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--danger-light);border-radius:8px;border-left:3px solid var(--danger)">
              <span>⚠️</span><div style="flex:1"><div style="font-size:13px;font-weight:700;color:#991b1b">David K — Advanced CAD Assignment</div><div style="font-size:11px;color:#991b1b">5 days overdue · Architecture Dept.</div></div><span class="badge badge-danger">Escalated</span>
            </div>
            <div style="display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--warning-light);border-radius:8px;border-left:3px solid var(--warning)">
              <span>⚠️</span><div style="flex:1"><div style="font-size:13px;font-weight:700;color:#92400e">Marcus L — Onboarding Track</div><div style="font-size:11px;color:#92400e">3 days overdue · Architecture Dept.</div></div><span class="badge badge-warning">Due</span>
            </div>
            <div style="display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--warning-light);border-radius:8px;border-left:3px solid var(--warning)">
              <span>⚠️</span><div style="flex:1"><div style="font-size:13px;font-weight:700;color:#92400e">Team Projects — Q3 Milestone</div><div style="font-size:11px;color:#92400e">2 days overdue · Projects Dept.</div></div><span class="badge badge-warning">Due</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="../js/nav.js"></script>
<script>
  const user = SDA.init({ role: 'admin' });
  if (user) {
    document.getElementById('content').style.display = '';
    const ctx = document.getElementById('dept-bar-chart').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Architecture','Engineering','Projects','HR','IT','Finance'],
        datasets: [{
          label: 'Completion %',
          data: [72, 85, 60, 90, 78, 65],
          backgroundColor: ['#3b82f6','#22c55e','#f59e0b','#22c55e','#6366f1','#f59e0b'],
          borderRadius: 6,
        }]
      },
      options: {
        responsive: true,
        plugins: { legend:{ display:false } },
        scales: {
          y: { min:0, max:100, ticks:{ callback:v=>v+'%', font:{size:11}, color:'#94a3b8' }, grid:{ color:'#f1f5f9' } },
          x: { ticks:{ font:{size:11}, color:'#94a3b8' }, grid:{ display:false } }
        }
      }
    });
  }
</script>
</body>
</html>
